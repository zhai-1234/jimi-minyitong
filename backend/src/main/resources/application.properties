spring.application.name=assistance-qa

# 服务器配置
server.port=${SERVER_PORT:8081}

# 数据库配置（通过环境变量注入，避免明文写死；本地开发使用默认值）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.jimi.assistance.model
# 下划线列名（user_id）自动映射为驼峰属性（userId）
mybatis.configuration.map-underscore-to-camel-case=true

# 允许跨域的前端来源（多个用逗号分隔）
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 日志配置
logging.level.com.jimi.assistance.mapper=debug
logging.level.com.jimi.assistance.service=info
logging.level.com.jimi.assistance.controller=info

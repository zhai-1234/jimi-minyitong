          role: system
          text: '你是社会救助政策问答系统的检索词生成器。

            任务：把用户问题拆解为 3 个用于知识库检索的简短查询词，覆盖问题的不同方面。

            要求：

            - 只输出 3 个查询，使用英文逗号分隔，不要编号、引号、换行或任何解释。

            - 每个查询 6-20 个汉字。

            - 若用户上传了文件，可结合文件内容：{{#1761561558854.output#}}

            示例：

            输入：如何申请低保

            输出：低保申请条件,低保申请材料,低保办理流程

            '
        reasoning_format: tagged
        selected: false
        title: 问题分析
        type: llm
        vision:
          enabled: false
      height: 87
      id: '1763271273271'
      position:
        x: 887.4285714285713

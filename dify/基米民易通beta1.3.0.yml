    - data:
        code: "def main(input_str: str, user_query: str, user_files: list = None) -> dict:\n    items = []\n    seen = set()\n    if input_str:\n        s = input_str.strip().strip('\"').strip('“').strip('”')\n        text = s.replace('，', ',').replace('、', ',').replace('；', ',').replace(';', ',')\n        for line in text.splitlines():\n            for part in line.split(','):\n                q = part.strip().strip('\"').strip('“').strip('”')\n                if q and q not in seen:\n                    seen.add(q)\n                    items.append(q)\n                    if len(items) >= 4:\n                        break\n            if len(items) >= 4:\n                break\n    base = (user_query or '').strip()\n    joined = '；'.join(items)\n    if user_files and joined:\n        query = (base + '；' + joined) if base else joined\n    else:\n        query = base or joined\n    return {'result': items, 'query': query}\n"
        code_language: python3
        outputs:
